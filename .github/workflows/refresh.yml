name: OPEN WORLD · aggiornamento gratuito
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '50 5 * * *'
    - cron: '50 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/**'
      - 'core/**'
      - 'site/*.html'
      - 'site/*.css'
      - 'site/*.js'
      - 'config/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: open-world-research
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Usa sempre l'ultimo stato di main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unittest (offline)
        run: python -m unittest discover -s tests -v
      - name: Fonti, dashboard e brief
        run: python scripts/refresh.py
      - name: Agenti AI · traduzione, analisi e memoria
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: |
          python -m py_compile scripts/ai_pipeline.py
          python scripts/ai_pipeline.py
      - name: Salva i dati in repository
        run: |
          git config user.name "open-world-bot"
          git config user.email "open-world-bot@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Auto: aggiornamento ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - name: Configura GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Pages non autorizzato
        if: steps.pages.outcome == 'failure'
        run: echo '::warning::La raccolta news è riuscita, ma Pages deve essere attivato una volta da Settings > Pages > Source > GitHub Actions.'
      - name: Prepara sito statico
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica su GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
