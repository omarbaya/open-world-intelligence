name: OPEN WORLD · aggiornamento gratuito
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '50 5 * * *'
    - cron: '50 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: open-world-research
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unittest (offline)
        run: python -m unittest discover -s tests -v
      - name: Fonti, dashboard e brief
        run: python scripts/refresh.py
      - name: Salva i dati in repository
        run: |
          git config user.name "open-world-bot"
          git config user.email "open-world-bot@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Auto: aggiornamento ${GITHUB_RUN_ID}"
            git pull --rebase
            git push
          fi
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara sito statico
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica su GitHub Pages
        uses: actions/deploy-pages@v4
