name: OPEN WORLD 3.0 - News + Agent AI + Pages
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '50 5 * * *'
    - cron: '50 6 * * *'
  workflow_dispatch:
    inputs:
      generate_ai:
        description: "Avvia subito l'analisi AI (quota Gemini gratuita)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh.yml'
      - 'core/**'
      - 'scripts/**'
      - 'config/**'
      - 'site/original/**'
      - 'site/ai/**'
      - 'site/index.html'
      - 'site/styles.css'
      - 'site/app.js'
      - 'tests/**'
      - 'requirements.txt'
      - 'config/prompts/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: open-world-research
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Parti dall'ultima versione di main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa jsonschema
        run: python -m pip install -r requirements.txt
      - name: Test automatici
        run: python -m unittest discover -s tests -v
      - name: Raccogli fonti e aggiorna dati
        run: python scripts/refresh.py
      - name: Agenti AI, traduzione, verifica e memoria
        if: ${{ hashFiles('scripts/ai_daily.py') != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          AI_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_ai == true }}
        run: python scripts/ai_daily.py
      - name: Salva brief e dati sul repository
        run: |
          git config user.name "open-world-bot"
          git config user.email "open-world-bot@users.noreply.github.com"
          mkdir -p /tmp/ow-save/data /tmp/ow-save/original
          cp -a site/data/. /tmp/ow-save/data/
          if [ -d site/original/data ]; then cp -a site/original/data/. /tmp/ow-save/original/; fi
          if [ -f state/forecast_events.jsonl ]; then cp state/forecast_events.jsonl /tmp/ow-save/forecast_events.jsonl; fi
          # Always base the data commit on the freshest main; never overwrite source code.
          # An append-only forecast log is merged by exact event line.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p site/data site/original/data state
            cp -a /tmp/ow-save/data/. site/data/
            cp -a /tmp/ow-save/original/. site/original/data/
            python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/ow-save/forecast_events.jsonl')
          dst=Path('state/forecast_events.jsonl')
          old=dst.read_text(encoding='utf-8').splitlines() if dst.exists() else []
          new=src.read_text(encoding='utf-8').splitlines() if src.exists() else []
          rows=list(dict.fromkeys(x for x in old+new if x.strip()))
          dst.write_text(''.join(x+'\n' for x in rows),encoding='utf-8')
          PY
            git add -A -- site/data site/original/data state/forecast_events.jsonl
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "AUTO: briefing e storico ${GITHUB_RUN_ID}"
            if git push origin HEAD:main; then exit 0; fi
            echo "Main avanzato durante la raccolta: riprovo sulla revisione corrente ($attempt/3)"
          done
          exit 1
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Prepara sito web
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica Pages
        id: deployment
        uses: actions/deploy-pages@v4
