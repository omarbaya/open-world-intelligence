name: Diagnostica gratuita fonti BCE CFTC (solo pubblico)
on:
  push:
    paths: ['.github/workflows/diagnose-public-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leggi schema CFTC e BCE senza chiavi
        run: |
          python - <<'PY'
          from urllib.request import urlopen,Request
          from urllib.parse import urlencode
          from urllib.error import HTTPError
          from zipfile import ZipFile
          from io import BytesIO,StringIO
          import csv
          def go(url):
            try:
              with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 (public audit)'}),timeout=28) as r:
                return r.read(10000000)
            except Exception as e:
              print(type(e).__name__,str(e)[:130]);return None
          b=go('https://www.cftc.gov/files/dea/history/deacot2026.zip')
          if b:
            with ZipFile(BytesIO(b)) as z:
              fs=[x for x in z.namelist() if x.lower().endswith(('.txt','.csv'))]
              print('CFTC_FILES',fs)
              if fs:
                raw=z.read(fs[0]).decode('utf-8-sig',errors='replace')
                reader=csv.DictReader(StringIO(raw))
                print('CFTC_FIELDS',reader.fieldnames)
                found={}
                for row in reader:
                  name=(row.get('Market_and_Exchange_Names') or row.get('Market and Exchange Names') or '')
                  for needle in ['GOLD','EURO FX','E-MINI S&P']:
                    if needle in name.upper() and needle not in found: found[needle]=str(row)[:900]
                  if len(found)>=3:break
                print('CFTC_EXAMPLES',found)
          e=go('https://data-api.ecb.europa.eu/service/data/EXR/D.USD.EUR.SP00.A?format=csvdata&lastNObservations=3')
          if e:
            print('ECB_LEN',len(e),'ECB_FIRST_LINES',e[:950].decode('utf-8-sig',errors='replace'))
          PY
